location / {
    root /usr/share/nginx/html;
}

# Mastodon API (entry points)
location /api/ {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
}

location /favicon.ico {
    root /usr/share/nginx/html;
}
