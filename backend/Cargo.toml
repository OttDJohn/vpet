[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
const_format = "0.2.36"
heed = "0.22.1"
ohkami = { version = "0.24", features = ["rt_tokio"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive", "serde_derive"]}
serde_json = "1.0.149"
tokio  = { version = "1",    features = ["full"] }
uuid = {   version = "1.23.1",  features = ["v4", "serde"] }
